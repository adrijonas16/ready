name: Buscar secretos (gitleaks)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (binario oficial, verificado con SHA-256)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Revisar commits nuevos
        run: |
          # En un PR: los commits del PR. En un push: los commits del push (o todo el historial en una rama nueva).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGO="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            RANGO="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGO="--all"
          fi
          echo "Rango: $RANGO"
          gitleaks git . --config .gitleaks.toml --log-opts="$RANGO" --redact --verbose --exit-code 1

      - name: Revisar archivos actuales
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose --exit-code 1
